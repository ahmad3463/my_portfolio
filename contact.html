<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="asessts/css/bootstrap.min.css">
</head>
<body>

      <!-- navbar is start  -->
      <nav class="navbar navbar-expand-lg p-4">
        <div class="container-fluid">
          <!-- Toggler Button for Smaller Screens -->
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <!-- Navbar Content -->
          <div class="collapse navbar-collapse" id="navbarNav">
            <!-- Navigation Links Aligned to the Right using ms-auto -->
            <ul class="navbar-nav ms-auto">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#">About</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Projects</a>
              </li>
              <li class="nav-item">
                <a class="nav-link me-3" href="#">Blog</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>

      <div class="container">
        <form action="#">
            <h2 class="text-center fw-bolder">Contact</h2>

           <div>
            <label for="#">Name :</label>
            <input type="text" name="user_name" placeholder="Enter Your Name">
           </div>
           <div>
            <label for="#">Email :</label>
            <input type="email" name="user_email" placeholder="Enter Your Email">
           </div>
           <div>
            <label for="#">Text :</label>
            <input type="" name="user_name" placeholder="Enter Your Name">
           </div>
           <button type="button">Send</button>
        </form>
      </div>

    <script src="asessts/js/bootstrap.bundle.min.js"></script>
    
</body>
</html>
